[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antenna-perception-sidecar"
version = "0.1.0"
description = "Model-runtime-independent OCR/VLM HTTP sidecar for the antenna MCP"
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
