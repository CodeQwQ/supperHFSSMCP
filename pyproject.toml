[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hfss-agent-mcp"
version = "0.1.2"
description = "Extensible MCP server skeleton for agent-driven Ansys HFSS workflows."
readme = "docs/architecture.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.20,<2",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
pyaedt = [
  "pyaedt>=1.2",
]
dev = []

[project.scripts]
hfss-agent-mcp = "hfss_agent_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
